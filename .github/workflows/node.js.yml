name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify CryptoCrawler clean-house boundaries
        run: node scripts/cryptocrawl/verify-clean-house.cjs
      - name: Verify CryptoCrawler no-regression opportunity pipeline
        run: node scripts/cryptocrawl/verify-no-regression-opportunity-pipeline.cjs
      - name: Verify startup database admission controls
        run: node scripts/cryptocrawl/verify-startup-database-admission.cjs
      - name: Verify CryptoCrawler deployment preflight
        env:
          NO_EXECUTION: 'true'
          NO_INTERVALS: 'true'
          CRYPTARA_MODE: SILENT_WATCHER_ONLY
        run: node scripts/cryptocrawl/verify-deployment-preflight.cjs
      - name: Build
        run: npm run build
      - name: Run TypeScript compilation check
        run: npm run check
      - name: Verify canonical runtime wiring
        run: npm run wire-check
      - name: Verify settlement lifecycle
        env:
          NO_EXECUTION: 'true'
          NO_INTERVALS: 'true'
        run: npm run verify:settlement-lifecycle
      - name: Verify provider failover
        env:
          NO_EXECUTION: 'true'
          NO_INTERVALS: 'true'
        run: npm run verify:provider-failover
      - name: Verify native-gas funding lifecycle
        run: npm run verify:native-gas-funding
      - name: Verify automatic native-gas plan
        run: npm run verify:automatic-native-gas-plan
      - name: Verify autonomous stage progression
        run: npm run verify:autonomous-stages
