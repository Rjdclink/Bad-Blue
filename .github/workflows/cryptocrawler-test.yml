name: Cryptocrawler Automated Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/services/cryptocrawl/**'
      - 'scripts/cryptocrawl/**'
      - '.github/workflows/cryptocrawler-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/services/cryptocrawl/**'
      - 'scripts/cryptocrawl/**'
      - '.github/workflows/cryptocrawler-test.yml'
  workflow_dispatch:
    inputs:
      simulation_iterations:
        description: 'Number of Monte Carlo iterations'
        required: false
        default: '1000'
      performance_levels:
        description: 'Performance levels to test (comma-separated: ideal,average,poor)'
        required: false
        default: 'ideal,average,poor'
      max_runtime_minutes:
        description: 'Maximum runtime in minutes'
        required: false
        default: '5'
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: cryptocrawler-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cryptocrawler-test:
    name: Cryptocrawler Monte Carlo Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SIMULATION_ITERATIONS: ${{ github.event.inputs.simulation_iterations || '1000' }}
      PERFORMANCE_LEVELS: ${{ github.event.inputs.performance_levels || 'ideal,average,poor' }}
      MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '5' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Verify no-regression opportunity pipeline
        run: node scripts/cryptocrawl/verify-no-regression-opportunity-pipeline.cjs
      - name: Build TypeScript
        run: npm run build
      - name: Run TypeScript compilation check
        run: npm run check
      - name: Run Cryptocrawler Test Suite
        id: test
        timeout-minutes: 10
        run: |
          echo "CRYPTOCRAWLER AUTOMATED TEST SUITE - STARTING"
          echo "Test Run ID: $TEST_RUN_ID"
          echo "Performance Levels: $PERFORMANCE_LEVELS"
          echo "Simulation Iterations: $SIMULATION_ITERATIONS"
          npx tsx server/services/cryptocrawl/testing/run-tests.ts \
            --iterations="$SIMULATION_ITERATIONS" \
            --levels="$PERFORMANCE_LEVELS" \
            --max-runtime="$MAX_RUNTIME_MINUTES" \
            2>&1 | tee test-output.log
          if grep -q "TEST_STATUS=PASSED" test-output.log; then
            echo "test_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "test_status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify native-gas funding lifecycle
        run: npm run verify:native-gas-funding
      - name: Verify automatic native-gas plan
        run: npm run verify:automatic-native-gas-plan
      - name: Verify autonomous stages
        run: npm run verify:autonomous-stages
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Cryptocrawler Test Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptocrawler-test-results-${{ github.run_id }}
          path: test-output.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Check Test Status
        if: steps.test.outputs.test_status == 'failed'
        run: exit 1

  extended-simulation:
    name: Extended Simulation (10K iterations)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: cryptocrawler-test
    permissions:
      contents: read
      actions: read
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TEST_RUN_ID: ${{ github.run_id }}-extended
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Verify no-regression opportunity pipeline
        run: node scripts/cryptocrawl/verify-no-regression-opportunity-pipeline.cjs
      - name: Run Extended Simulation
        timeout-minutes: 45
        run: |
          npx tsx server/services/cryptocrawl/testing/run-tests.ts \
            --iterations="10000" \
            --levels="ideal,average,poor" \
            --max-runtime="45" \
            --persist-all \
            2>&1 | tee extended-test-output.log
      - name: Upload Extended Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptocrawler-extended-results-${{ github.run_id }}
          path: extended-test-output.log
          retention-days: 90
