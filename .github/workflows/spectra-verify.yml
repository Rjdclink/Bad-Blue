name: SPECTRA Verify

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/spectra-verify.yml'
      - 'client/src/pages/spectra.tsx'
      - 'client/src/components/geoconsole/**'
      - 'server/routes/spectra.routes.ts'
      - 'server/routes/geoconsole.routes.ts'
      - 'server/services/spectra/**'
      - 'server/services/geoconsole/**'
      - 'server/migrations/*spectra*'
      - 'scripts/verify-spectra*'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: spectra-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps 2>&1 | tee npm-ci.log

      - name: Run SPECTRA regression suite
        run: npm run verify:spectra 2>&1 | tee spectra-verify.log

      - name: Run TypeScript compilation check
        if: always()
        run: npm run check 2>&1 | tee typescript-check.log

      - name: Upload SPECTRA verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-verification-diagnostics
          path: |
            npm-ci.log
            spectra-verify.log
            typescript-check.log
          if-no-files-found: warn
          retention-days: 7
