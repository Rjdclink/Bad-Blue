name: Cryptocrawler Monte Carlo Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      simulation_iterations:
        description: 'Number of Monte Carlo iterations'
        required: false
        default: '5000'

# Prevent concurrent runs
concurrency:
  group: monte-carlo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      actions: read
    
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Run Monte Carlo Tests
        id: monte-carlo
        run: |
          echo "Running Monte Carlo simulation tests..."
          npx tsx server/services/cryptocrawl/testing/run-tests.ts \
            --iterations="${{ github.event.inputs.simulation_iterations || '5000' }}" \
            --levels="ideal,average,poor" \
            --max-runtime="20" \
            2>&1 || {
            echo "::warning::Monte Carlo tests completed with warnings"
          }
          echo "Monte Carlo tests completed"
