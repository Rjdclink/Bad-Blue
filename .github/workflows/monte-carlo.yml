name: Monte Carlo Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build --if-present
      
      - name: Run Monte Carlo Tests
        run: npx tsx server/services/cryptocrawl/testing/run-tests.ts --iterations="1000" --levels="ideal,average,poor" --max-runtime="10"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
