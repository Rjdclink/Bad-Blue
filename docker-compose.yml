version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/legalwhat
    env_file:
      - .env
    volumes:
      - ./client:/app/client
      - ./server:/app/server
      - ./public:/app/public
      - /app/node_modules
    # NOTE: If you add or remove dependencies, run `docker-compose build` to ensure container dependencies are up to date.
    # NOTE: If you add or remove dependencies, run `docker-compose build` to ensure container dependencies are up to date.
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=legalwhat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
