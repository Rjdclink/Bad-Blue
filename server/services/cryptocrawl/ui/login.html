<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoCrawl - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo h1 {
      font-size: 48px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo p {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .login-card {
      background: #1a1f3a;
      border-radius: 16px;
      padding: 40px;
      border: 1px solid #2a2f4a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      background: #0f1425;
      border: 1px solid #2a2f4a;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      transition: all 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }
    
    .checkbox-group label {
      margin: 0;
      font-size: 14px;
      font-weight: normal;
      color: #94a3b8;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .error-msg {
      background: #dc2626;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .error-msg.show {
      display: block;
    }
    
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .footer {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🔥 CryptoCrawl</h1>
      <p>Secure Dashboard Access</p>
    </div>
    
    <div class="login-card">
      <div id="errorMsg" class="error-msg"></div>
      
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        
        <button type="submit" id="loginBtn" onclick="login()">
          <span id="loginBtnText">Sign In</span>
          <div id="loadingSpinner" class="loading-spinner"></div>
        </button>
      </form>
    </div>
    
    <div class="footer">
      © 2024 CryptoCrawl. All rights reserved.
    </div>
  </div>
  
  <script>
    // Check if already logged in
    (function() {
      const token = localStorage.getItem('adminToken');
      if (token) {
        // Verify token is still valid
        fetch('/api/auth/verify', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token})
        })
        .then(res => res.json())
        .then(result => {
          if (result.valid) {
            // Already logged in, redirect to dashboard
            window.location.href = '/dashboard.html';
          }
        })
        .catch(() => {
          // Token verification failed, continue to login
        });
      }
    })();
    
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      
      // Clear previous errors
      errorMsg.classList.remove('show');
      errorMsg.textContent = '';
      
      // Show loading state
      loginBtn.disabled = true;
      loginBtnText.style.display = 'none';
      loadingSpinner.style.display = 'block';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });
        
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('adminToken', result.token);
          localStorage.setItem('userEmail', email);
          
          // Smooth redirect
          window.location.href = '/dashboard.html';
        } else {
          // Show error message
          errorMsg.textContent = result.message || 'Login failed';
          errorMsg.classList.add('show');
          
          // Reset button state
          loginBtn.disabled = false;
          loginBtnText.style.display = 'inline';
          loadingSpinner.style.display = 'none';
        }
      } catch (error) {
        // Network or server error
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('show');
        
        // Reset button state
        loginBtn.disabled = false;
        loginBtnText.style.display = 'inline';
        loadingSpinner.style.display = 'none';
      }
    }
    
    // Allow Enter key to submit
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      login();
    });
    
    // Focus email input on load
    window.addEventListener('load', function() {
      document.getElementById('email').focus();
    });
  </script>
</body>
</html>
