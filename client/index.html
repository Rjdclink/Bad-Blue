    <script>
      // Performance monitoring - start timing
      window.appLoadStartTime = performance.now();
      console.log('[Performance] Page load started at:', window.appLoadStartTime);
      
      // Remove loader when React is mounted
      window.hideInitialLoader = function() {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => {
            loader.style.display = 'none';
            const loadTime = performance.now() - window.appLoadStartTime;
            console.log('[Performance] React app ready. Total load time:', loadTime.toFixed(2) + 'ms');
          }, 300);
        }
      };
    </script>
