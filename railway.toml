
# Railway Configuration for BadBlue
# Platform-independent deployment configuration
# Redeploy trigger: refresh production from the current develop head.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
# Deployment admission must use strict readiness. /api/health remains the cheap
# runtime liveness endpoint, but it intentionally goes 200 as soon as HTTP binds.
# Railway must not promote a new replica until database initialization, migrations,
# governance/schema verification, routes and background services are complete.
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables should be configured in Railway dashboard
# Required environment variables:
# 
# Database (Supabase):
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
# - SUPABASE_DB_URL
# - DATABASE_URL (same as SUPABASE_DB_URL)
#
# Authentication:
# - SUPABASE_ANON_KEY
# - SESSION_SECRET
# - MASTER_ADMIN_EMAIL
# - MASTER_ADMIN_PASSWORD
# - ADMIN_BYPASS_EMAIL and ADMIN_BYPASS_PASSWORD (optional legacy bypass)
#
# AI Services:
# - MISTRAL_API_KEY
# - GROQ_API_KEY
# - GEMINI_API_KEY
# - ANTHROPIC_API_KEY
#
# Payment:
# - STRIPE_SECRET_KEY
# - VITE_STRIPE_PUBLIC_KEY
#
# Email:
# - RESEND_API_KEY
#
# Feature Flags (for migration):
# - USE_SUPABASE_DB (true/false)
# - USE_SUPABASE_AUTH (true/false)
# - USE_SUPABASE_STORAGE (true/false)
#
# Railway-specific:
# - RAILWAY_ENVIRONMENT (auto-set by Railway)
# - RAILWAY_PROJECT_ID (auto-set by Railway)