
# Railway deployment policy for BadBlue.
# Railway auto-detects the repository-root Dockerfile, and the image owns its
# start command via Docker CMD. Keep Config-as-Code limited to deploy policy so
# stale builder/path/start overrides cannot block snapshot/build initialization.

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables should be configured in Railway dashboard
# Required environment variables:
# 
# Database (Supabase):
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
# - SUPABASE_DB_URL
# - DATABASE_URL (same as SUPABASE_DB_URL)
#
# Authentication:
# - SUPABASE_ANON_KEY
# - SESSION_SECRET
# - MASTER_ADMIN_EMAIL
# - MASTER_ADMIN_PASSWORD
# - ADMIN_BYPASS_EMAIL and ADMIN_BYPASS_PASSWORD (optional legacy bypass)
#
# AI Services:
# - MISTRAL_API_KEY
# - GROQ_API_KEY
# - GEMINI_API_KEY
# - ANTHROPIC_API_KEY
#
# Payment:
# - STRIPE_SECRET_KEY
# - VITE_STRIPE_PUBLIC_KEY
#
# Email:
# - RESEND_API_KEY
#
# Feature Flags (for migration):
# - USE_SUPABASE_DB (true/false)
# - USE_SUPABASE_AUTH (true/false)
# - USE_SUPABASE_STORAGE (true/false)
#
# Railway-specific:
# - RAILWAY_ENVIRONMENT (auto-set by Railway)
# - RAILWAY_PROJECT_ID (auto-set by Railway)
